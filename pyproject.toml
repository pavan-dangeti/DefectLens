[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defectlens"
version = "0.1.0"
description = "Defect detection on manufactured parts from a single photo"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.3",
  "mlflow>=2.12",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
  "faiss-cpu>=1.15.1",
  "anomalib>=2.6.2",
  "onnx>=1.23.1",
  "onnxruntime>=1.30.0",
  "onnxscript>=0.7.2",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.108",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
defectlens = "defectlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/defectlens"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90"]
ignore = ["E501", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "yaml.*", "sklearn.*", "timm.*", "torchvision.*", "scipy.*", "onnx.*", "onnxruntime.*", "pandas.*", "skimage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "hypothesis: property-based tests",
]

[tool.coverage.run]
source = ["src/defectlens"]
branch = true
omit = [
  # heavyweight parity runner: executed by results/parity/run.py, not CI
  "src/defectlens/eval/parity.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:"]
