name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run mypy --strict src/defectlens

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-fail-under=85 --cov-report=term-missing --cov-report=xml
      - name: Verify no data or artefacts committed
        run: |
          if git ls-files | grep -E '^(data|artifacts)/|\.env$|\.tar$|\.onnx$|\.faiss$'; then
            echo "Refuse to commit data, artefacts or secrets"; exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Export the locked dependency set
        run: uv export --frozen --no-hashes --no-emit-project > requirements.txt
      - name: Fail on known vulnerabilities in locked dependencies
        run: uvx pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image installs torch with its CUDA wheels (several GB), which the default runner's disk
      # cannot hold twice over during the uv install. Remove preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: docker build -t defectlens:ci .
      - name: Scan the image for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # The image carries torch's CUDA libraries, so analysis takes longer than Trivy's 5-minute default.
          TRIVY_TIMEOUT: 30m
        with:
          image-ref: defectlens:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
